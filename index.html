<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ゲットリッチ復活</title><meta name="robots" content="noindex"><style>#debug-panel{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+1+Code:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css?v=89">
<link rel="stylesheet" href="fx.css?v=89">
<link rel="stylesheet" href="board.css?v=89">
</head><body>
<!-- 画面の骨組みだけ。ボタンの動作は view/app.js で結びつける（HTMLからルールを直接呼ばない） -->
<!-- タイトル画面（タップでキャラ選択へ） -->
<div id="title-ov">
  <div class="tt-bg"></div><div class="tt-rays"></div><div class="tt-sparks"></div>
  <div class="tt-main">
    <img id="title-logo" alt="GET RICHERS">
    <div class="tt-tap">TAP TO START</div>
  </div>
</div>
<div id="char-select-ov">
  <img id="char-select-logo" alt="GET RICHERS">
  <div id="char-select-title">CHARACTER SELECT</div>
  <div id="char-select-sub">プレイするキャラクターを選んでください</div>
  <button id="btn-rules-top" type="button">📖 ルールブックを読む</button>
  <!-- 友達対戦：部屋を作る／入る -->
  <div id="mp-bar">
    <button id="btn-mp-solo" class="mp-tab on" type="button">🤖 ひとりで遊ぶ</button>
    <button id="btn-mp-host" class="mp-tab" type="button">👥 友達と遊ぶ（部屋を作る）</button>
  </div>
  <div id="mp-lobby" hidden>
    <div id="mp-status"></div>
    <div id="mp-invite" hidden>
      <div class="mp-lbl">このリンクを友達に送ってください</div>
      <div class="mp-linkrow"><input id="mp-link" readonly><button id="btn-mp-copy" type="button">コピー</button><button id="btn-mp-share" type="button">送る</button></div>
    </div>
    <div id="mp-members"></div>
    <div id="mp-help">使うキャラをタップして選んでください（もう一度タップで取り消し）。空いたキャラはCPUが動かします。</div>
    <button id="btn-mp-start" class="primary" type="button" hidden>ゲーム開始</button>
  </div>
  <div id="char-select-grid"></div>
</div>
<div id="quake-banner"></div>
<div id="sys-bar"><button id="btn-bgm">♪ BGM</button><button id="btn-se">🔊 効果音</button><button id="btn-speed">速度 ×1</button><button id="btn-rules">📖 ルール</button></div>
<div id="roof-choice-ov">
  <div id="roof-choice-box">
    <img id="roof-img" src="" alt="屋根の色">
    <div id="roof-btns">
      <button class="roof-btn black" data-roof="black">黒</button>
      <button class="roof-btn gray" data-roof="gray">グレー</button>
    </div>
  </div>
</div>
<div id="glow-flash"></div>
<div id="skill-splash">
  <div id="skill-splash-rays"></div>
  <img id="skill-splash-img" src="" alt="">
  <div id="skill-splash-text">
    <div id="skill-splash-name"></div>
    <div id="skill-splash-title"></div>
  </div>
</div>
<div id="root">
  <div id="game-layout">
    <div id="panel-top-left"><div id="pp0" class="pp"></div></div>
    <div id="board-area">
      <div id="card-tray"></div>
      <div id="board-outer">
        <div id="board-container">
          <div id="board-rotated">
            <div id="ctrl-panel">
              <div id="turn-badge">ターン <span id="tn">1</span>/<span id="tmax">30</span></div>
              <div id="dice-row">
                <div id="dial" aria-hidden="true"><div id="dial-hand"><span class="knob"></span></div></div>
                <div class="die3d-wrap"><div class="die3d" id="die1"></div></div><div id="dsum">—</div><div class="die3d-wrap"><div class="die3d" id="die2"></div></div>
              </div>
              <div id="tap-hint">タップでストップ！</div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div id="panel-top-right"><div id="pp1" class="pp"></div></div>
    <div id="panel-bot-left"><div id="pp2" class="pp"></div></div>
    <div id="panel-bot-right"><div id="pp3" class="pp"></div></div>
  </div>
  <div id="log-outer"><div id="log-wrap"></div></div>
</div>
<div id="buy-ov" class="ov"><div id="buy-box" class="mbox">
  <div id="buy-title"></div><div id="buy-sub"></div>
  <div id="buy-opts"></div><div id="buy-total">合計: <b>0M</b></div>
  <div class="modal-btns"><button id="btn-buy-cancel">キャンセル</button><button class="primary" id="btn-confirm">購入</button></div>
</div></div>
<div id="sell-ov" class="ov"><div id="sell-box" class="mbox">
  <h2>💸 資産売却</h2><div id="sell-status"></div><div id="sell-list"></div>
  <div class="modal-btns"><button class="danger" id="btn-bankrupt">このまま破産</button></div>
</div></div>
<div id="travel-ov" class="ov"><div id="travel-box" class="mbox">
  <h2 id="travel-title"></h2><div id="tlist"></div>
</div></div>
<div id="win-ov" class="ov"><div id="win-box" class="mbox">
  <h2 id="win-title"></h2><div id="win-cond"></div><div id="win-detail"></div>
  <div id="win-ranks"></div><div class="modal-btns" id="win-btns"></div>
</div></div>
<div id="gen-ov" class="ov"><div id="gen-box" class="mbox">
  <h2 id="gen-title"></h2><p id="gen-body"></p>
  <div class="modal-btns" id="gen-btns"></div>
</div></div>

<!-- デバッグスイッチ -->
<div id="debug-panel">
  <div id="debug-switch">
    <div id="debug-toggle"></div>
    <span id="debug-label">DEBUGモード OFF</span>
  </div>
  <div id="debug-dice-row">
    <span id="debug-dice-label">次の合計:</span>
  </div>
  <div id="debug-event-row">
    <span id="debug-event-label">イベント指定:</span>
    <select id="debug-event-select"><option value="">ランダム</option></select>
  </div>
</div>

<!-- 読み込み順：設定表 → ルール → CPU → 画面 -->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';document.head.appendChild(s)"></script>
<script charset="utf-8" src="data/config.js?v=89"></script>
<script charset="utf-8" src="rules/engine.js?v=89"></script>
<script charset="utf-8" src="rules/ai.js?v=89"></script>
<script charset="utf-8" src="view/audio.js?v=89"></script>
<script charset="utf-8" src="view/fx.js?v=89"></script>
<script charset="utf-8" src="view/actors.js?v=89"></script>
<script charset="utf-8" src="view/blueprint.js?v=89"></script>
<script charset="utf-8" src="view/rulebook.js?v=89"></script>
<script charset="utf-8" src="view/net.js?v=89"></script>
<script charset="utf-8" src="view/app.js?v=89"></script>
</body></html>
